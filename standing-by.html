<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standing By</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --bg: #EEF1F3;
    --surface: #FFFFFF;
    --ink: #151A21;
    --muted: #5C6672;
    --faint: #8A93A0;
    --border: #DBE1E6;
    --accent: #C97A1E;
    --accent-ink: #201200;
    --accent-soft: #C97A1E22;
    --danger: #B8453C;
    --shadow: rgba(20, 26, 33, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0E13;
      --surface: #11161D;
      --ink: #E7ECF1;
      --muted: #8B96A3;
      --faint: #566270;
      --border: #202832;
      --accent: #E8A33D;
      --accent-ink: #1A1200;
      --accent-soft: #E8A33D26;
      --danger: #E08278;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0A0E13;
    --surface: #11161D;
    --ink: #E7ECF1;
    --muted: #8B96A3;
    --faint: #566270;
    --border: #202832;
    --accent: #E8A33D;
    --accent-ink: #1A1200;
    --accent-soft: #E8A33D26;
    --danger: #E08278;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 20px;
    padding-block: 48px;
  }

  .stage {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark-glyph {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--ink);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    flex: none;
  }

  .mark-name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px var(--shadow), 0 12px 32px -20px var(--shadow);
    padding: 36px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    animation: pulse 2.2s ease-in-out infinite;
    flex: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .status-dot { animation: none; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1 {
    margin: 0;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 34px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .lede {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 40ch;
  }

  .divider {
    height: 1px;
    background: var(--border);
    border: none;
    margin: 0;
  }

  .access-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field-row {
    display: flex;
    gap: 8px;
  }

  input[type="password"] {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 13px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 0.03em;
  }

  input[type="password"]::placeholder {
    color: var(--faint);
    letter-spacing: 0.02em;
    font-family: "IBM Plex Sans", sans-serif;
  }

  input[type="password"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    flex: none;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .field-row.shake input {
    animation: shake 0.32s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .field-row.shake input { animation: none; }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .feedback {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    line-height: 1.5;
  }

  .feedback.is-visible { color: var(--danger); }

  footer {
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--faint);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="mark">
    <div class="mark-glyph">kb</div>
    <span class="mark-name">kevinbai.dev</span>
  </div>

  <div class="panel">
    <div class="status-row">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Status &mdash; updating</span>
    </div>

    <div>
      <h1>Site&rsquo;s being rebuilt.</h1>
      <p class="lede">Making changes behind the scenes right now. Everything will be back shortly &mdash; check back soon.</p>
    </div>

    <hr class="divider">

    <div>
      <p class="access-label" id="access-label">Have access?</p>
      <form id="gate-form" aria-labelledby="access-label">
        <div class="field-row" id="field-row">
          <input type="password" id="pw" name="password" placeholder="Enter password" autocomplete="current-password" aria-describedby="pw-feedback">
          <button type="submit">Enter</button>
        </div>
        <p class="feedback" id="pw-feedback" role="status"></p>
      </form>
    </div>
  </div>

  <footer>&copy; <span id="year"></span> &mdash; back online soon</footer>
</div>

<script>
  (function () {
    document.getElementById('year').textContent = new Date().getFullYear();

    var form = document.getElementById('gate-form');
    var row = document.getElementById('field-row');
    var input = document.getElementById('pw');
    var feedback = document.getElementById('pw-feedback');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      row.classList.remove('shake');
      void row.offsetWidth;
      row.classList.add('shake');
      feedback.textContent = 'Not open yet — the site is still updating.';
      feedback.classList.add('is-visible');
      input.focus();
    });

    input.addEventListener('input', function () {
      feedback.classList.remove('is-visible');
      feedback.textContent = '';
    });
  })();
</script>

</body>
</html>
